name: Continuous Integration

on:
  # Validate changes before and after they land on the default branch.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the repository contents are required for this read-only CI workflow.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    steps:
      # Retrieves the exact revision associated with the push or pull request.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the supported Node.js version and caches npm's package cache.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Installs the lockfile-resolved dependency tree for reproducible builds.
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      # Next.js performs an optimized production build, matching Vercel's build step.
      - name: Build application
        run: npm run build
